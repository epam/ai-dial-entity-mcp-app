server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on;
  gzip_min_length 1024;

  location = /_mcp-app/index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = / {
    add_header Cache-Control "no-cache";
    try_files /_mcp-app/index.html =404;
  }

  location / {
    return 404;
  }
}
