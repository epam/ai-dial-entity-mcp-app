name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/node_pr.yml@4.12.0
    with:
      node-version: 24
      trivy-severity: "CRITICAL,HIGH,MEDIUM,LOW"
      trivy-severity-for-sarif: "CRITICAL,HIGH,MEDIUM,LOW"
    secrets: inherit

  # Repository-owned: node_pr.yml runs `npm run format` (prettier --write),
  # `npm run lint` and `npm run test` (Vitest strips types without checking
  # them), so neither formatting nor types are actually checked there.
  repo_checks:
    name: Typecheck and format check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
