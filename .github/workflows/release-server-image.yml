name: Release server image

on:
  push:
    branches: [development, release-*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: epam/ai-dial-ci/actions/build_docker@4.12.0
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.ACTIONS_BOT_TOKEN }}
          image-names: ghcr.io/${{ github.repository }}-entity-mcp
          image-tags: type=ref,event=branch
          push-enabled: true
          platforms: linux/amd64
          dockerfile-path: servers/entity-mcp/Dockerfile
